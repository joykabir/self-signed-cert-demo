# Self-Signed Certificate Demo Application Properties

# Default server configuration
app.server.port=9001
app.server.keystore.path=ssl-demo.p12
app.server.keystore.password=changeit

# Certificate configuration
app.cert.keysize=4096
app.cert.validity.years=3
app.cert.algorithm=RSA
app.cert.signature.algorithm=SHA256withRSA

# SSL/TLS configuration
app.ssl.protocols=TLSv1.3,TLSv1.2
app.ssl.enabled.cipher.suites=TLS_AES_256_GCM_SHA384,TLS_CHACHA20_POLY1305_SHA256,TLS_AES_128_GCM_SHA256

# Testing configuration
app.test.load.default.requests=100
app.test.load.default.concurrency=10
app.test.timeout.seconds=30

# Logging configuration
app.logging.request.details=true
app.logging.ssl.session.details=true